<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Service Status</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            :root {
                color-scheme: light dark;
            }

            body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI",
                    "Helvetica Neue", sans-serif;
                background: #f9f9f9;
                color: #161616;
            }

            @media (prefers-color-scheme: dark) {
                body {
                    background: #0d1117;
                    color: #f0f4f8;
                }
            }

            .container {
                width: 100%;
                max-width: 500px;
                padding: 2rem;
            }

            .card {
                padding: 3rem 2.5rem;
                background: #f4f4f4;
                text-align: center;
                border: 1px solid #e0e0e0;
            }

            @media (prefers-color-scheme: dark) {
                .card {
                    background: #161b22;
                    border: 1px solid #30363d;
                }
            }

            .status-indicator {
                display: inline-block;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #24a148;
                flex-shrink: 0;
                animation: pulse 2s ease-in-out infinite;
            }

            @media (prefers-color-scheme: dark) {
                .status-indicator {
                    background: #42be65;
                }
            }

            @keyframes pulse {
                0%,
                100% {
                    box-shadow: 0 0 0 0 rgba(36, 161, 72, 0.7);
                }

                50% {
                    box-shadow: 0 0 0 8px rgba(36, 161, 72, 0);
                }
            }

            @media (prefers-color-scheme: dark) {
                @keyframes pulse {
                    0%,
                    100% {
                        box-shadow: 0 0 0 0 rgba(66, 190, 101, 0.7);
                    }

                    50% {
                        box-shadow: 0 0 0 8px rgba(66, 190, 101, 0);
                    }
                }
            }

            h1 {
                font-size: 2.2rem;
                font-weight: 700;
                margin-top: 0;
                margin-bottom: 1rem;
                letter-spacing: -0.5px;
                color: #161616;
            }

            @media (prefers-color-scheme: dark) {
                h1 {
                    color: #ffffff;
                }
            }

            .subtitle {
                font-size: 0.95rem;
                color: #525252;
                margin-bottom: 1.75rem;
                line-height: 1.6;
                font-weight: 400;
            }

            @media (prefers-color-scheme: dark) {
                .subtitle {
                    color: #a0aec0;
                }
            }

            .status-text {
                display: inline-flex;
                align-items: center;
                gap: 0.6rem;
                font-size: 0.8rem;
                color: #24a148;
                font-weight: 600;
                margin-top: 0.5rem;
                padding: 0.5rem 1rem;
                background: #defce8;
                border: 1px solid #24a148;
                text-transform: uppercase;
                letter-spacing: 0.4px;
            }

            @media (prefers-color-scheme: dark) {
                .status-text {
                    color: #42be65;
                    background: #161e2e;
                    border: 1px solid #42be65;
                }
            }

            @media (max-width: 480px) {
                .card {
                    padding: 2.5rem 2rem;
                }

                h1 {
                    font-size: 1.8rem;
                }

                .subtitle {
                    font-size: 0.9rem;
                }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="card">
                <h1>Service Active</h1>
                <p class="subtitle">
                    Your infrastructure is operational and running smoothly. All
                    systems are ready to serve.
                </p>
                <div class="status-text">
                    <div class="status-indicator"></div>
                    Operational
                </div>
            </div>
        </div>
    </body>
</html>
